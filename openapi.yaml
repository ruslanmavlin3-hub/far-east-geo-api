openapi: 3.1.0

info:
  title: Far East Land Geo API
  description: >
    Геопространственный API для поиска и предварительной проверки
    территорий по программе Дальневосточный и Арктический гектар.
    Поддерживает геокодирование, инфраструктурный анализ,
    предварительную проверку данных НСПД, земельных ограничений,
    контуров, поиск перспективных территорий и инвестиционный скоринг.
  version: 3.1.0

servers:
  - url: https://far-east-geo-api.onrender.com

paths:

  /health:
    get:
      operationId: healthCheck
      summary: Проверить работу Far East Land Geo API
      description: >
        Возвращает состояние сервиса, его версию и признак
        стабильности контракта.
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /check-point:
    get:
      operationId: checkPoint
      summary: Проверить координаты точки
      description: >
        Проверяет корректность координат и доступность базового
        географического запроса.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта WGS84
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90

        - name: lon
          in: query
          required: true
          description: Долгота WGS84
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180

      responses:
        "200":
          description: Результат проверки точки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /geocode:
    get:
      operationId: geocodePlace
      summary: Найти координаты населённого пункта или территории
      description: >
        Геокодирует название города, посёлка, района или другой
        географической территории и возвращает возможные координаты.
      parameters:
        - name: place
          in: query
          required: true
          description: >
            Название места, например Благовещенск или Амурская область
          schema:
            type: string
            minLength: 2

      responses:
        "200":
          description: Результаты геокодирования
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /nearby-infrastructure:
    get:
      operationId: nearbyInfrastructure
      summary: Проверить инфраструктуру вокруг точки
      description: >
        Ищет доступные сведения об автомобильных дорогах,
        населённых пунктах, железной дороге, промышленных территориях
        и электросетевой инфраструктуре вокруг заданной точки.
        Результат является предварительным инфраструктурным анализом
        и сам по себе не подтверждает юридическую доступность земли.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта WGS84
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90

        - name: lon
          in: query
          required: true
          description: Долгота WGS84
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180

        - name: radius_km
          in: query
          required: false
          description: Радиус поиска инфраструктуры в километрах
          schema:
            type: number
            format: double
            minimum: 0.2
            maximum: 25
            default: 5

      responses:
        "200":
          description: Инфраструктура вокруг точки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        "502":
          description: Все внешние инфраструктурные источники недоступны
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /land-check:
    get:
      operationId: landCheck
      summary: Проверить земельно-кадастровый контекст точки
      description: >
        Выполняет предварительную земельную проверку координаты.
        Может проверять доступные слои НСПД: земельные участки ЕГРН,
        кадастровые кварталы, участки, образуемые по схеме,
        участки или территории, отображаемые как свободные от прав
        третьих лиц, и аукционные участки.

        Если источник НСПД недоступен, результат source_error
        означает техническую недоступность источника и НЕ означает
        отсутствие земельных участков.

        Отсутствие объекта в картографическом слое также не является
        подтверждением свободной земли или возможности её получения
        по Федеральному закону 119-ФЗ.

        Юридическую доступность участка считать подтверждённой только
        тогда, когда API прямо возвращает соответствующее подтверждение.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта проверяемой точки WGS84
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90

        - name: lon
          in: query
          required: true
          description: Долгота проверяемой точки WGS84
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180

      responses:
        "200":
          description: >
            Предварительная земельно-кадастровая проверка точки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /restrictions:
    get:
      operationId: checkRestrictions
      summary: Проверить земельные ограничения вокруг точки
      description: >
        Предназначен для проверки ЗОУИТ, публичных сервитутов,
        лесных и водных ограничений, ООПТ, объектов культурного
        наследия и других пространственных ограничений.

        Если конкретный источник ещё не подключён, его статус
        должен рассматриваться как непроверенный, а не как отсутствие
        ограничения.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта WGS84
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90

        - name: lon
          in: query
          required: true
          description: Долгота WGS84
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180

        - name: radius_m
          in: query
          required: false
          description: Радиус проверки ограничений в метрах
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 5000
            default: 100

      responses:
        "200":
          description: Результат проверки ограничений
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /check-contour:
    post:
      operationId: checkContour
      summary: Проверить предполагаемый контур нового участка
      description: >
        Принимает полигон в GeoJSON-подобном формате и выполняет
        доступные проверки предполагаемой территории образования
        земельного участка.

        Используется после выбора перспективной зоны для анализа
        конкретного будущего контура. Если необходимые официальные
        источники не подключены или недоступны, API не должен
        автоматически считать образование участка возможным.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContourRequest"

      responses:
        "200":
          description: Результат предварительной проверки контура
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        "400":
          description: Некорректная геометрия полигона
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /search-area:
    get:
      operationId: searchArea
      summary: Найти перспективные зоны для дальнейшей проверки
      description: >
        Выполняет предварительный поиск перспективных территорий
        вокруг указанного населённого пункта или региона.

        Анализирует инфраструктурные признаки и формирует кандидатов
        для дальнейшего landCheck, checkRestrictions и checkContour.

        Результат searchArea является географическим и инвестиционным
        скринингом. Он НЕ подтверждает, что территория свободна,
        может быть образована или предоставлена по 119-ФЗ.
      parameters:
        - name: region
          in: query
          required: true
          description: >
            Регион поиска, например Амурская область
          schema:
            type: string
            minLength: 2

        - name: center
          in: query
          required: false
          description: >
            Населённый пункт или ориентир внутри региона,
            например Благовещенск
          schema:
            type: string

        - name: radius_km
          in: query
          required: false
          description: Радиус предварительного поиска в километрах
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 100
            default: 20

        - name: purpose
          in: query
          required: false
          description: >
            Цель использования территории, например warehouse,
            logistics, tourism, agriculture, housing или general
          schema:
            type: string
            default: general

      responses:
        "200":
          description: Предварительно найденные территории
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /candidate-score:
    post:
      operationId: candidateScore
      summary: Рассчитать инвестиционный рейтинг территории
      description: >
        Рассчитывает предварительный рейтинг кандидата по 100-балльной
        системе с учётом юридической доступности, дорог, электроснабжения,
        драйверов развития, соответствия цели, физических характеристик,
        ликвидности и стоимости освоения.

        Наличие stop_factors приводит к рейтингу STOP.

        Инвестиционный рейтинг не заменяет официальную земельную
        проверку и не подтверждает право на получение участка.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateScoreRequest"

      responses:
        "200":
          description: Рейтинг территории
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true


components:

  schemas:

    ContourRequest:
      type: object
      required:
        - coordinates

      properties:

        type:
          type: string
          default: Polygon
          enum:
            - Polygon

        coordinates:
          type: array
          description: >
            Координаты полигона в порядке longitude, latitude.
            Первый и последний узел кольца должны совпадать.
          minItems: 1

          items:
            type: array
            minItems: 4

            items:
              type: array
              minItems: 2
              maxItems: 2

              items:
                type: number
                format: double

    CandidateScoreRequest:
      type: object

      properties:

        purpose:
          type: string
          default: general
          description: Цель использования территории

        legal_availability:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Юридическая доступность

        roads:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Автомобильная доступность

        power:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Электросетевая инфраструктура

        development_drivers:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Подтверждённые драйверы развития территории

        purpose_fit:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Соответствие территории цели пользователя

        physical_characteristics:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Физические характеристики территории

        liquidity:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Потенциальный спрос и ликвидность

        development_cost:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: >
            Оценка затрат на освоение: более высокий балл означает
            более благоприятную экономику освоения

        stop_factors:
          type: array
          description: >
            Критические факторы, при которых кандидат должен быть
            исключён из дальнейшего рассмотрения
          items:
            type: string
          default: []
